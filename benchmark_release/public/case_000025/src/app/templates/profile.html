{% extends "layout.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="page-header">
  <h2>My Profile</h2>
</div>

<div class="profile-grid">
  <div class="card">
    <h3>Account Information</h3>
    <form method="post" action="/profile/update">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ user_obj.full_name or '' }}" maxlength="100">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" value="{{ user_obj.email or '' }}" maxlength="200">
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" value="{{ user_obj.department or '' }}" maxlength="100">
      </div>
      <div class="form-group">
        <label>Role</label>
        <input type="text" value="{{ user_obj.role }}" disabled>
      </div>
      <div class="form-group">
        <label>Member Since</label>
        <input type="text" value="{{ user_obj.created_at[:10] if user_obj.created_at else '—' }}" disabled>
      </div>
      <button type="submit" class="btn btn-primary">Update Profile</button>
    </form>
  </div>

  <div class="card">
    <h3>Change Password</h3>
    <form method="post" action="/profile/change-password">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current_password" required>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" minlength="8" required>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
  </div>

  <div class="card">
    <h3>Notification Settings</h3>
    <form method="post" action="/profile/settings">
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" name="notify_email" {% if settings.notify_email %}checked{% endif %}>
          Email notifications
        </label>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" name="notify_slack" {% if settings.notify_slack %}checked{% endif %}>
          Slack notifications
        </label>
      </div>
      <div class="form-group">
        <label>Theme</label>
        <select name="theme">
          <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
          <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
        </select>
      </div>
      <div class="form-group">
        <label>Timezone</label>
        <select name="timezone">
          <option value="UTC" {% if settings.timezone == 'UTC' %}selected{% endif %}>UTC</option>
          <option value="America/New_York" {% if settings.timezone == 'America/New_York' %}selected{% endif %}>Eastern</option>
          <option value="America/Chicago" {% if settings.timezone == 'America/Chicago' %}selected{% endif %}>Central</option>
          <option value="America/Los_Angeles" {% if settings.timezone == 'America/Los_Angeles' %}selected{% endif %}>Pacific</option>
          <option value="Europe/London" {% if settings.timezone == 'Europe/London' %}selected{% endif %}>London</option>
          <option value="Europe/Berlin" {% if settings.timezone == 'Europe/Berlin' %}selected{% endif %}>Berlin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Items per page</label>
        <select name="items_per_page">
          <option value="10" {% if settings.items_per_page == 10 %}selected{% endif %}>10</option>
          <option value="25" {% if settings.items_per_page == 25 %}selected{% endif %}>25</option>
          <option value="50" {% if settings.items_per_page == 50 %}selected{% endif %}>50</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
