<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Analytics — Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #0f172a; color: #e2e8f0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 40px;
                width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 24px; font-weight: 700; color: #38bdf8; }
        .logo span { font-size: 13px; color: #64748b; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155;
                border-radius: 6px; color: #e2e8f0; font-size: 14px; outline: none; margin-bottom: 16px; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #0ea5e9; color: white; border: none;
                 border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0284c7; }
        .error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>◈ Nexus Analytics</h1>
            <span>Business Intelligence Platform</span>
        </div>
        <form id="loginForm">
            <label>Username</label>
            <input type="text" id="username" placeholder="your username" autocomplete="username">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            <button type="submit">Sign In</button>
            <div class="error" id="errorMsg"></div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.style.display = 'block';
                }
            } catch(err) {
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
