{% extends "layout.html" %}
{% block title %}ModelHub — Error {{ code }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center;max-width:480px;margin:4rem auto">
  <h1 style="font-size:4rem;margin:0">{{ code }}</h1>
  <p>{{ message }}</p>
  <a href="/dashboard" class="btn btn-primary">Back to dashboard</a>
</div>
{% endblock %}
