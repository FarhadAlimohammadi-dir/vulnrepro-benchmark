version: '3.9'
services:
  modelhub:
    build: .
    ports:
      - '9000:9000'
    environment:
      - PORT=9000
      - DB_PATH=/tmp/modelhub.db
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
