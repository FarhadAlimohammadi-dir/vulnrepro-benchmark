version: '3.8'
services:
  gateway-portal:
    build: .
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: "gw-prod-secret-2024"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s