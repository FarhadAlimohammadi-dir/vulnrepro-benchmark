version: '3.8'

services:
  web:
    build: .
    ports:
      - "9000:9000"
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/themes.db
      - UPLOAD_FOLDER=/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
