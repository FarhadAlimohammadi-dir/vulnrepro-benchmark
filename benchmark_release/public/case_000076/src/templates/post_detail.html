{% extends "base.html" %}
{% block title %}{{ post.title | e }} — OldBlog{% endblock %}
{% block content %}
<article>
  <h1>{{ post.title | e }}</h1>
  <p class="meta">By <a href="/users/{{ post.author | e }}">{{ post.author | e }}</a> &middot; {{ post.created_at }}</p>
  <div class="body">{{ post.body | e }}</div>
  <p class="tags">
    {% for tag in post.tags %}<span class="tag">{{ tag | e }}</span> {% endfor %}
  </p>
</article>
<p><a href="/posts">&larr; Back to posts</a></p>
{% endblock %}
