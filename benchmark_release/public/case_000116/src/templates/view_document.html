<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocShare - {{ doc.title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; }
        .nav { background: #0066cc; padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; }
        .nav a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        pre { background: #f8f8f8; padding: 1rem; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
        .meta { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .btn { padding: 0.4rem 0.8rem; border-radius: 4px; text-decoration: none; font-size: 0.85rem; margin-right: 0.5rem; }
        .btn-secondary { background: #eee; color: #333; }
    </style>
</head>
<body>
<nav class="nav">
    <strong>DocShare</strong>
    <div>
        <a href="/documents">Back to Documents</a>
        <a href="/logout">Logout</a>
    </div>
</nav>
<div class="container">
    <div class="card">
        <h2>{{ doc.title }}</h2>
        <div class="meta">
            Owner: {{ doc.owner_name }} &bull; Created: {{ doc.created_at }} &bull; Type: {{ doc.declared_type }}
        </div>
        <pre>{{ doc.content }}</pre>
        <a href="/documents/{{ doc.id }}/raw" class="btn btn-secondary">Raw</a>
        <a href="/documents/{{ doc.id }}/preview" class="btn btn-secondary">Preview</a>
        <a href="/documents/{{ doc.id }}/download" class="btn btn-secondary">Download</a>
    </div>
</div>
</body>
</html>
