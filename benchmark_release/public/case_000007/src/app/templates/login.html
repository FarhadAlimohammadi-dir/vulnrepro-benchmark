{% extends "base.html" %}
{% block title %}Login — ToolForge{% endblock %}
{% block content %}
<div class="login-box">
  <h2>Sign in to ToolForge</h2>
  <form action="/login" method="post">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="your username" required/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>
  <p class="login-hint">Default accounts: admin / alice / bob</p>
</div>
{% endblock %}
