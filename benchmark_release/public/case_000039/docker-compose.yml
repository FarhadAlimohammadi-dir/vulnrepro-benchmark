version: '3.8'

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-change-in-deploy
      - DATABASE_PATH=/app/data/workspace.db
    volumes:
      - workspace_data:/app/data

volumes:
  workspace_data:
