version: "3.9"

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - FLASK_APP=app/main.py
      - SECRET_KEY=prod-secret-key-cdn-dashboard-2024
    volumes:
      - cdn_data:/app/data
    restart: unless-stopped

volumes:
  cdn_data:
