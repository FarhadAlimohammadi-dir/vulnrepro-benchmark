<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProjectHub – Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f2f5; }
        nav { background: #1a1a2e; color: #fff; padding: 14px 24px;
              display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 1.2rem; }
        nav a { color: #a5b4fc; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 1000px; margin: 32px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 24px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { color: #1a1a2e; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px;
                 font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-admin { background: #fef3c7; color: #92400e; }
        .badge-user { background: #e0f2fe; color: #075985; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
        th { color: #6b7280; font-size: 0.8rem; text-transform: uppercase; }
        button.sm { padding: 6px 14px; background: #4f46e5; color: #fff;
                    border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    </style>
</head>
<body>
<nav>
    <h1>ProjectHub</h1>
    <div>
        <span style="margin-right:16px">{{ user.username }}
            <span class="badge badge-{{ user.role }}">{{ user.role }}</span>
        </span>
        <a href="/logout">Sign out</a>
    </div>
</nav>
<div class="container">
    <div class="card">
        <h2>Welcome back, {{ user.full_name or user.username }}</h2>
        <p style="color:#6b7280;margin-top:8px">
            Department: {{ user.department or '—' }} &nbsp;|&nbsp;
            Account type: <strong>{{ user.role }}</strong>
        </p>
    </div>

    {% if user.is_admin() %}
    <div class="card">
        <h2>Admin Panel</h2>
        <p style="margin-bottom:16px;color:#6b7280">Manage users and audit logs.</p>
        <button class="sm" onclick="loadUsers()">Load All Users</button>
        <div id="userTable" style="margin-top:16px"></div>
    </div>
    <script>
    async function loadUsers() {
        const r = await fetch('/api/admin/users');
        const d = await r.json();
        if (!d.users) return;
        let html = '<table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Dept</th></tr></thead><tbody>';
        d.users.forEach(u => {
            html += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.email}</td><td>${u.role}</td><td>${u.department||'—'}</td></tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('userTable').innerHTML = html;
    }
    </script>
    {% endif %}

    <div class="card">
        <h2>Your Projects</h2>
        <div id="projectList"><em style="color:#9ca3af">Loading…</em></div>
    </div>
</div>
<script>
(async () => {
    const r = await fetch('/api/projects');
    const d = await r.json();
    if (!d.projects || !d.projects.length) {
        document.getElementById('projectList').innerHTML = '<em style="color:#9ca3af">No projects yet.</em>';
        return;
    }
    let html = '<table><thead><tr><th>Name</th><th>Status</th><th>Created</th></tr></thead><tbody>';
    d.projects.forEach(p => {
        html += `<tr><td>${p.name}</td><td>${p.status}</td><td>${p.created_at.slice(0,10)}</td></tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('projectList').innerHTML = html;
})();
</script>
</body>
</html>
