services:
  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      DEMO_MODE: "true"
      LOG_LEVEL: info
      PORT: "9000"
      ANTHROPIC_API_KEY: "sk-ant-demo-1234567890"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
