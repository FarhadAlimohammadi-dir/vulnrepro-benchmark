<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meridian HR Portal – Sign In</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.1.3/angular.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 16px rgba(0,0,0,0.12); padding: 40px 36px; width: 380px; }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { color: #1a3a5c; font-size: 24px; font-weight: 700; }
        .logo p { color: #6b7a8d; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #344055; font-weight: 600; margin-bottom: 6px; }
        input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #d0d7e2; border-radius: 5px; font-size: 14px; color: #222; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #3b7dd8; }
        .btn-primary { width: 100%; padding: 11px; background: #1a3a5c; color: #fff; border: none; border-radius: 5px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .btn-primary:hover { background: #2a5298; }
        .error-msg { background: #fff3f3; border: 1px solid #f5c6cb; color: #721c24; border-radius: 5px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 12px; color: #8a97a8; }
        .footer-links a { color: #3b7dd8; text-decoration: none; }
    </style>
</head>
<body>
<div ng-app="meridianApp">
    <div class="login-card">
        <div class="logo">
            <h1>&#127970; Meridian HR</h1>
            <p>Employee Self-Service Portal</p>
        </div>

        {% if error %}
        <div class="error-msg" id="loginError">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" id="frm" name="frm">
            <div class="form-group">
                <label for="txtUserId">Employee ID / Username</label>
                <input type="text"
                       id="txtUserId"
                       name="txtUserId"
                       value="{{ prefill_user }}"
                       autocomplete="username"
                       placeholder="Enter your username" />
            </div>
            <div class="form-group">
                <label for="txtpassword">Password</label>
                <input type="password"
                       id="txtpassword"
                       name="txtpassword"
                       autocomplete="current-password"
                       placeholder="Enter your password" />
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="footer-links">
            <p>Forgot password? Contact <a href="mailto:helpdesk@meridian.internal">IT Helpdesk</a></p>
            <p style="margin-top:8px;">&copy; 2024 Meridian Corporation. All rights reserved.</p>
        </div>
    </div>
</div>
<script>
    angular.module('meridianApp', []);
</script>
</body>
</html>
