<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DocVault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 380px; }
        h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 0.25rem; }
        p.sub { color: #718096; font-size: 0.875rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; color: #4a5568; margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.625rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 0.875rem; margin-bottom: 1rem; }
        input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
        button { width: 100%; padding: 0.625rem; background: #4299e1; color: white; border: none; border-radius: 4px; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
        button:hover { background: #3182ce; }
        .divider { text-align: center; color: #a0aec0; font-size: 0.75rem; margin: 1rem 0; }
        .oauth-btn { background: white; color: #4a5568; border: 1px solid #e2e8f0; }
        .oauth-btn:hover { background: #f7fafc; }
        .error { background: #fff5f5; color: #c53030; padding: 0.75rem; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DocVault</h1>
        <p class="sub">Sign in to your account</p>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            <button type="submit">Sign in</button>
        </form>
        <div class="divider">or</div>
        <button class="oauth-btn" onclick="oauthLogin()">Continue with MockProvider</button>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                const err = document.getElementById('errorMsg');
                err.textContent = data.error || 'Login failed';
                err.style.display = 'block';
            }
        });

        function oauthLogin() {
            const email = document.getElementById('email').value;
            if (!email) { alert('Enter your email first'); return; }
            const callback = window.location.origin + '/oauth/callback';
            window.location.href = `/oauth/authorize?email=${encodeURIComponent(email)}&redirect_uri=${encodeURIComponent(callback)}&state=login`;
        }
    </script>
</body>
</html>
