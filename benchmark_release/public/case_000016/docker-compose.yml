version: '3.8'
services:
  devflow:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      DB_PATH: /data/devflow.db
      SECRET_KEY: devflow-docker-secret
    volumes:
      - devflow_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  devflow_data:
