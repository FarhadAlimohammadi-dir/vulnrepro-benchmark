version: '3.9'

services:
  web:
    build: .
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-apiforge-2024
      - DATABASE_PATH=/app/data/apiforge.db
    volumes:
      - apiforge_data:/app/data
    restart: unless-stopped

volumes:
  apiforge_data: