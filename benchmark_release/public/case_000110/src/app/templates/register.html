{% extends "base.html" %}
{% block title %}Register — TaskFlow{% endblock %}
{% block content %}
<div style="max-width:400px;margin:3rem auto;">
    <div class="card">
        <h1 style="font-size:1.5rem;margin-bottom:1.5rem;text-align:center;">Create Account</h1>
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus minlength="3" maxlength="32">
            </div>
            <div class="form-group">
                <label for="display_name">Display Name</label>
                <input type="text" id="display_name" name="display_name" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:.75rem;">Create Account</button>
        </form>
        <p style="margin-top:1rem;text-align:center;font-size:.9rem;">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
