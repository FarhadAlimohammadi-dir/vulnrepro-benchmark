<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub - Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f7fa; }
        .topbar { background: #667eea; color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .topbar h2 { margin: 0; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .widget-panel { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 24px; }
        .widget-panel h3 { color: #333; margin-top: 0; }
        #widget-content { border: 1px solid #eee; border-radius: 8px; padding: 16px; min-height: 80px; background: #fafafa; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .status.active { background: #d4edda; color: #155724; }
        .status.planning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div class="topbar">
        <h2>ProjectHub Dashboard</h2>
        <span id="user-display">Loading...</span>
    </div>
    <div class="container">
        <div class="widget-panel">
            <h3>Live Dashboard Widget</h3>
            <p>This panel receives live updates from embedded widgets via the messaging bridge.</p>
            <div id="widget-content">Awaiting widget data...</div>
        </div>
        <div class="widget-panel">
            <h3>Recent Projects</h3>
            <div id="projects-list">Loading projects...</div>
        </div>
    </div>
    <script>
        // Widget message bridge - receives postMessage events from embedded iframes
        window.addEventListener('message', function(event) {
            var allowedOrigin = 'dashboard.projecthub.local';
            if (event.origin.indexOf(allowedOrigin) === -1) {
                return;
            }
            var panel = document.getElementById('widget-content');
            if (event.data && event.data.html) {
                panel.innerHTML = event.data.html;
            }
        });

        // Load user info
        fetch('/api/auth/me').then(r => r.json()).then(u => {
            document.getElementById('user-display').textContent = u.username || 'Guest';
        }).catch(() => {
            document.getElementById('user-display').textContent = 'Guest';
        });

        // Load projects
        fetch('/api/projects').then(r => r.json()).then(projects => {
            var list = document.getElementById('projects-list');
            if (!Array.isArray(projects) || projects.length === 0) {
                list.textContent = 'No projects found.';
                return;
            }
            list.innerHTML = projects.slice(0, 5).map(p =>
                '<div style="padding:12px;border-bottom:1px solid #eee">' +
                '<strong>' + p.name + '</strong> ' +
                '<span class="status ' + p.status + '">' + p.status + '</span>' +
                '<br><small>' + (p.description || '') + '</small></div>'
            ).join('');
        }).catch(() => {
            document.getElementById('projects-list').textContent = 'Unable to load projects.';
        });
    </script>
</body>
</html>
