<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — NexusAI Workspace</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">⬡ NexusAI</div>
  <h2>Sign in to Workspace</h2>
  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="your.username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary full-width">Sign In</button>
  </form>
  <p class="auth-footer">NexusAI Workspace &mdash; Enterprise Edition</p>
</div>
</body>
</html>
