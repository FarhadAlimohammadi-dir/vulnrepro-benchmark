{% extends "base.html" %}
{% block title %}Edit Profile — PromptForge{% endblock %}
{% block content %}
<div class="form-container">
  <h2>Edit Profile</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
  <form method="post" action="/profile/edit">
    <div class="form-group">
      <label>Full Name</label>
      <input name="full_name" type="text" value="{{ user.full_name or '' }}">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input name="email" type="email" value="{{ user.email or '' }}">
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea name="bio" rows="4">{{ user.bio or '' }}</textarea>
    </div>
    <button type="submit" class="btn-primary">Save Changes</button>
    <a href="/profile" class="btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
