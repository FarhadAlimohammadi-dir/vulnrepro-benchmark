services:
  promptforge:
    build: .
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      SECRET_KEY: "pf-compose-secret-2024"
      DB_PATH: "/tmp/promptforge.db"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s