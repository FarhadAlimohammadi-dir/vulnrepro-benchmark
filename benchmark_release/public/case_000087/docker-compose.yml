version: '3.8'

services:
  assetflow:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - '9000:9000'
    environment:
      - NODE_ENV=production
      - PORT=9000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

# Benchmark packaging note: build context is under ./src.
