<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudPanel — Sign In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f0f2f5; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 8px; padding: 2.5rem;
          width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1a1a2e; }
  label { display: block; margin-bottom: .25rem; font-size: .85rem; color: #555; }
  input { width: 100%; padding: .6rem .8rem; border: 1px solid #d1d5db;
          border-radius: 6px; font-size: .95rem; margin-bottom: 1rem; }
  button { width: 100%; padding: .7rem; background: #4f46e5; color: #fff;
           border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #4338ca; }
  .alert { padding: .6rem .8rem; background: #fee2e2; color: #991b1b;
           border-radius: 6px; margin-bottom: 1rem; font-size: .9rem; }
  .info { padding: .6rem .8rem; background: #e0f2fe; color: #0369a1;
          border-radius: 6px; margin-bottom: 1rem; font-size: .9rem; }
</style>
</head>
<body>
<div class="card">
  <h1>☁ CloudPanel</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="{{ 'alert' if cat == 'error' else 'info' }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post" action="/auth/login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next_url }}">
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
