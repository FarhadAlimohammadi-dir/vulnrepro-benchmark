version: "3.9"

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///docflow.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped

volumes:
  db_data:
