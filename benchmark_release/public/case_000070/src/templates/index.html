<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocFlow — Collaborative Documents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f5f7fa; }
        header { background: #1a1f36; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.4rem; }
        main { max-width: 860px; margin: 4rem auto; padding: 0 1rem; text-align: center; }
        h2 { font-size: 2.2rem; color: #1a1f36; }
        p { color: #555; font-size: 1.1rem; }
        .btn { display: inline-block; margin: 0.5rem; padding: 0.75rem 2rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
        .btn-primary { background: #635bff; color: #fff; }
        .btn-secondary { background: #fff; color: #635bff; border: 2px solid #635bff; }
    </style>
</head>
<body>
    <header>
        <h1>📄 DocFlow</h1>
        <nav>
            <a href="/login" style="color:#fff; text-decoration:none; margin-left:1.5rem;">Sign In</a>
        </nav>
    </header>
    <main>
        <h2>Documents, simplified.</h2>
        <p>Create, collaborate, and share documents with your team in real time.</p>
        <a href="/login" class="btn btn-primary">Get Started</a>
        <a href="/dashboard" class="btn btn-secondary">View Dashboard</a>
    </main>
</body>
</html>
