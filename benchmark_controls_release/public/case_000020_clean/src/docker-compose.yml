version: '3.8'
services:
  toolbridge:
    build: .
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s