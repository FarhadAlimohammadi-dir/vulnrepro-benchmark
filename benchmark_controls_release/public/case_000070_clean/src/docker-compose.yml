version: "3.9"

services:
  web:
    build: .
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-change-me-2025
      - DATABASE_URL=sqlite:///docflow.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped

volumes:
  db_data: