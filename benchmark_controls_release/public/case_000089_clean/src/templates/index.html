<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamDash - Message Queue Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; }
        .navbar { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        .navbar h1 { font-size: 1.4rem; color: #7c83fd; font-weight: 700; }
        .navbar span { color: #64748b; font-size: 0.875rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-healthy { background: #064e3b; color: #34d399; }
        .badge-degraded { background: #451a03; color: #fb923c; }
        .badge-unknown { background: #1e293b; color: #94a3b8; }
        .cluster-meta { font-size: 0.85rem; color: #64748b; margin-top: 0.5rem; }
        a { color: #7c83fd; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>⚡ StreamDash</h1>
        <span>Message Queue Monitoring</span>
    </div>
    <div class="container">
        <h2 class="section-title">Connected Clusters</h2>
        <div class="grid">
        {% for cluster in clusters %}
        <div class="card">
            <h3><a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></h3>
            <span class="badge badge-{{ cluster.status }}">{{ cluster.status }}</span>
            <div class="cluster-meta">
                <div>{{ cluster.bootstrap_servers }}</div>
                <div style="margin-top:0.25rem">{{ cluster.description }}</div>
            </div>
        </div>
        {% endfor %}
        </div>
    </div>
</body>
</html>
