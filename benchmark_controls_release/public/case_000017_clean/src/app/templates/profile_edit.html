{% extends "layout.html" %}
{% block title %}Edit Profile &mdash; NexusChat{% endblock %}
{% block content %}
<div class="content-page content-narrow">
  <div class="page-header">
    <h2>Edit Profile</h2>
  </div>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
  <form method="post" class="form-card">
    <div class="form-group">
      <label class="form-label">Display Name</label>
      <input class="form-input" name="display_name" value="{{ user.display_name or '' }}" maxlength="64">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" name="email" type="email" value="{{ user.email or '' }}">
    </div>
    <div class="form-group">
      <label class="form-label">Bio</label>
      <textarea class="form-input" name="bio" rows="4" maxlength="500">{{ user.bio or '' }}</textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save Changes</button>
      <a class="btn btn-outline" href="/profile">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
