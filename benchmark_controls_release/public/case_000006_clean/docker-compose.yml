version: '3.9'
services:
  novaspark:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - PORT=9000
      - LOG_LEVEL=info
    volumes:
      - novaspark_data:/app
    restart: unless-stopped

volumes:
  novaspark_data:
