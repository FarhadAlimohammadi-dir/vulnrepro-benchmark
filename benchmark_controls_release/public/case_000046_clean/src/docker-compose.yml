version: '3.8'

services:
  web:
    build: .
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-change-me-2024
      - DATABASE_PATH=/app/data/app.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data: