version: "3.9"

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/taskflow.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
