{% extends "base.html" %}
{% block title %}Sign In — TaskFlow{% endblock %}
{% block content %}
<div style="max-width:400px;margin:3rem auto;">
    <div class="card">
        <h1 style="font-size:1.5rem;margin-bottom:1.5rem;text-align:center;">Sign In to TaskFlow</h1>
        <form method="POST" action="/login">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:.75rem;">Sign In</button>
        </form>
        <p style="margin-top:1rem;text-align:center;font-size:.9rem;">
            Don't have an account? <a href="/register">Register</a>
        </p>
    </div>
</div>
{% endblock %}
