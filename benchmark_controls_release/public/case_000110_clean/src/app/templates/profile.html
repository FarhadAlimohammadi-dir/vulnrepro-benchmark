{% extends "base.html" %}
{% block title %}Profile — TaskFlow{% endblock %}
{% block content %}
<div style="max-width:600px;margin:0 auto;">
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem;">Edit Profile</h1>
    <div class="card">
        <form method="POST" action="/profile">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ user.username }}" disabled style="background:#f7fafc;color:#718096;">
            </div>
            <div class="form-group">
                <label for="display_name">Display Name</label>
                <input type="text" id="display_name" name="display_name" value="{{ user.display_name }}" required>
                <small style="color:#718096;">This name appears on your dashboard greeting and throughout the app.</small>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ user.email or '' }}">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/change-password" class="btn btn-secondary" style="margin-left:.5rem;">Change Password</a>
        </form>
    </div>
</div>
{% endblock %}
