version: '3.8'
services:
  nexus:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - '9000:9000'
    environment:
      - PORT=9000
      - DB_PATH=/tmp/nexus.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
