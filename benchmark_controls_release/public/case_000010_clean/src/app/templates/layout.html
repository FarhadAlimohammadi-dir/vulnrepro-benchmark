<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NexusAI Workspace{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav">
  <div class="nav-brand">
    <a href="/">⬡ NexusAI Workspace</a>
  </div>
  <div class="nav-links">
    {% if user %}
      <a href="/">Dashboard</a>
      <a href="/documents">Documents</a>
      <a href="/settings">Settings</a>
      {% if user.role == 'admin' %}
        <a href="/admin">Admin</a>
      {% endif %}
      <a href="/profile">👤 {{ user.display_name or user.username }}</a>
      <a href="/logout" class="btn-signout">Sign out</a>
    {% else %}
      <a href="/login">Sign In</a>
    {% endif %}
  </div>
</nav>
<div class="page-wrapper">
  {% block content %}{% endblock %}
</div>
<footer class="footer">
  <span>NexusAI Workspace v2.4.1 &mdash; &copy; 2024 Nexus Technologies Inc.</span>
</footer>
</body>
</html>
