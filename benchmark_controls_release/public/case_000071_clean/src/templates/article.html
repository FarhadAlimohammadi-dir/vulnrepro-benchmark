<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article['title'] }} – ContentFlow</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; color: #333; }
        h1 { color: #1a56db; }
        .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
        .tag { background: #f0fdf4; color: #166534; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-right: 4px; }
        .body { line-height: 1.7; }
        a { color: #1a56db; }
    </style>
</head>
<body>
    <a href="/">&larr; Back to home</a>
    <h1>{{ article['title'] }}</h1>
    <div class="meta">
        By <strong>{{ article['author'] }}</strong> &middot;
        {{ article['published_at'][:10] }} &middot;
        Category: {{ article['category'] }}
        {% if article['tags'] %}
        &middot;
        {% for tag in article['tags'].split(',') %}
        <span class="tag">{{ tag.strip() }}</span>
        {% endfor %}
        {% endif %}
    </div>
    <div class="body">
        <p>{{ article['body'] }}</p>
    </div>
</body>
</html>
