<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meridian HR – Change Password</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; }
        .nav { background: #1a3a5c; color: #fff; padding: 14px 32px; }
        .container { max-width: 480px; margin: 40px auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.08); padding: 28px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #344055; }
        input { width: 100%; padding: 9px 11px; border: 1px solid #d0d7e2; border-radius: 5px; font-size: 14px; }
        .btn { background: #1a3a5c; color: #fff; border: none; padding: 10px 24px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 14px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 14px; }
    </style>
</head>
<body>
<div class="nav"><h2>&#127970; Meridian HR Portal</h2></div>
<div class="container">
    <div class="card">
        <h3 style="color:#1a3a5c;margin-bottom:20px;">Change Password</h3>
        {% if message %}<div class="alert-success">{{ message }}</div>{% endif %}
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <form method="post">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" required>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
