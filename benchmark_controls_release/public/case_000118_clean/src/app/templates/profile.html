<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meridian HR – My Profile</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; }
        .nav { background: #1a3a5c; color: #fff; padding: 14px 32px; display: flex; justify-content: space-between; }
        .nav a { color: #aec6e8; text-decoration: none; margin-left: 18px; font-size: 14px; }
        .container { max-width: 640px; margin: 36px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.08); padding: 28px; margin-bottom: 20px; }
        .field { margin-bottom: 14px; font-size: 14px; }
        .field strong { display: inline-block; width: 140px; color: #344055; }
    </style>
</head>
<body>
<div class="nav">
    <h2>&#127970; Meridian HR</h2>
    <div><a href="/dashboard">Dashboard</a><a href="/change-password">Change Password</a><a href="/logout">Sign Out</a></div>
</div>
<div class="container">
    <div class="card">
        <h3 style="color:#1a3a5c;margin-bottom:18px;">My Profile</h3>
        <div class="field"><strong>Username:</strong> {{ user.username }}</div>
        <div class="field"><strong>Email:</strong> {{ user.email }}</div>
        <div class="field"><strong>Department:</strong> {{ user.department }}</div>
        <div class="field"><strong>Role:</strong> {{ user.role }}</div>
    </div>
</div>
</body>
</html>
