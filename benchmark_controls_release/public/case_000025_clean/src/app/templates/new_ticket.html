{% extends "layout.html" %}
{% block title %}New Ticket{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Submit a New Ticket</h2>
  <a href="/" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
  <form id="ticketForm" class="ticket-form">
    <input type="hidden" id="csrfToken" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="subject">Subject <span class="required">*</span></label>
      <input type="text" id="subject" name="subject" maxlength="200"
             placeholder="Brief description of your issue" required>
    </div>
    <div class="form-group">
      <label for="body">Description <span class="required">*</span></label>
      <textarea id="body" name="body" rows="8" maxlength="4000"
                placeholder="Please describe your issue in detail. Include any error messages, steps to reproduce, and your environment." required></textarea>
      <small class="char-count">Max 4000 characters</small>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Submit Ticket</button>
      <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
  <div id="submitResult" class="submit-result" style="display:none;"></div>
</div>

<script>
document.getElementById('ticketForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const subject = document.getElementById('subject').value;
  const body = document.getElementById('body').value;
  const btn = this.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const r = await fetch('/api/ticket', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': document.getElementById('csrfToken').value},
      body: JSON.stringify({subject, body})
    });
    const d = await r.json();
    const res = document.getElementById('submitResult');
    res.style.display = 'block';
    if (r.ok) {
      res.className = 'submit-result success';
      res.textContent = '';
      const headline = document.createElement('strong');
      headline.textContent = 'Ticket submitted!';
      const triageLabel = document.createElement('strong');
      triageLabel.textContent = 'AI Triage:';
      const summarySpan = document.createElement('span');
      summarySpan.textContent = ' ' + (d.summary || '—') + ' ';
      const link = document.createElement('a');
      link.href = '/';
      link.textContent = 'View all tickets';
      res.appendChild(headline);
      res.appendChild(document.createElement('br'));
      res.appendChild(triageLabel);
      res.appendChild(summarySpan);
      res.appendChild(document.createElement('br'));
      res.appendChild(link);
      this.reset();
    } else {
      res.className = 'submit-result error';
      res.textContent = 'Error: ' + (d.error || 'Unknown error');
    }
  } catch(err) {
    document.getElementById('submitResult').textContent = 'Network error. Please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Ticket';
  }
});
</script>
{% endblock %}
