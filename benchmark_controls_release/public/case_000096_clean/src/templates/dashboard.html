<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCheck – Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f2f5; }
        .navbar { background: #fff; padding: 0 2rem; height: 56px; display: flex;
                  align-items: center; justify-content: space-between;
                  box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .logo { font-size: 1.2rem; font-weight: 700; color: #2563eb; }
        .user-info { font-size: 0.875rem; color: #6b7280; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        h1 { font-size: 1.5rem; color: #111827; margin-bottom: 1.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer;
               font-size: 0.875rem; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-sm { padding: 0.25rem 0.625rem; font-size: 0.8rem; }
        .checks-grid { display: grid; gap: 1rem; }
        .check-card { background: #fff; padding: 1.25rem; border-radius: 8px;
                      box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .check-header { display: flex; align-items: center; justify-content: space-between; }
        .check-name { font-weight: 600; color: #111827; }
        .check-url { color: #6b7280; font-size: 0.8rem; margin-top: 0.25rem; }
        .status-badge { padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
        .status-up { background: #d1fae5; color: #065f46; }
        .status-down { background: #fee2e2; color: #991b1b; }
        .status-unknown { background: #f3f4f6; color: #6b7280; }
        .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                         align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; padding: 2rem; border-radius: 8px; width: 520px; max-height: 80vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 1.5rem; font-size: 1.1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.5rem 0.75rem;
                border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.875rem; }
        .result-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px;
                      padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.8rem;
                      white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚡ PulseCheck</div>
        <div class="user-info">
            Logged in as <strong>{{ user.username }}</strong>
            <button class="btn btn-sm" onclick="logout()" style="margin-left:1rem">Logout</button>
        </div>
    </nav>
    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
            <h1>Uptime Checks</h1>
            <button class="btn btn-primary" onclick="openCreateModal()">+ New Check</button>
        </div>
        <div class="checks-grid" id="checksGrid">
            <div style="color:#6b7280;text-align:center;padding:3rem">Loading checks...</div>
        </div>
    </div>

    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <h2>New Uptime Check</h2>
            <div class="form-group">
                <label>Check Name</label>
                <input type="text" id="newName" placeholder="e.g. Production API">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="text" id="newUrl" placeholder="https://api.example.com/health">
            </div>
            <div class="form-group">
                <label>Method</label>
                <select id="newMethod"><option>GET</option><option>POST</option><option>HEAD</option></select>
            </div>
            <div class="form-group">
                <label>Custom Headers (JSON)</label>
                <input type="text" id="newHeaders" placeholder='{"Authorization": "Bearer token"}'>
            </div>
            <div class="form-group">
                <label>Expected Status Code</label>
                <input type="number" id="newStatus" value="200">
            </div>
            <div class="form-group">
                <label>Content Match (optional)</label>
                <input type="text" id="newContentMatch" placeholder="ok">
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:1rem">
                <button class="btn btn-primary" onclick="createCheck()">Create</button>
                <button class="btn" onclick="closeModal('createModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <h2>Test Result</h2>
            <div class="result-box" id="resultContent"></div>
            <button class="btn" onclick="closeModal('resultModal')" style="margin-top:1rem">Close</button>
        </div>
    </div>

    <script>
        async function loadChecks() {
            const resp = await fetch('/api/checks');
            if (!resp.ok) return;
            const data = await resp.json();
            const grid = document.getElementById('checksGrid');
            if (!data.checks.length) {
                const empty = document.createElement('div');
                empty.style.cssText = 'color:#6b7280;text-align:center;padding:3rem';
                empty.textContent = 'No checks yet. Create your first check!';
                grid.textContent = '';
                grid.appendChild(empty);
                return;
            }
            grid.textContent = '';
            const allowedStatus = new Set(['up', 'down', 'unknown']);
            data.checks.forEach(c => {
                const card = document.createElement('div');
                card.className = 'check-card';
                const header = document.createElement('div');
                header.className = 'check-header';
                const left = document.createElement('div');
                const nameDiv = document.createElement('div');
                nameDiv.className = 'check-name';
                nameDiv.textContent = c.name;
                const urlDiv = document.createElement('div');
                urlDiv.className = 'check-url';
                urlDiv.textContent = c.url;
                left.appendChild(nameDiv);
                left.appendChild(urlDiv);
                const status = allowedStatus.has(c.last_status) ? c.last_status : 'unknown';
                const badge = document.createElement('span');
                badge.className = 'status-badge status-' + status;
                badge.textContent = status;
                header.appendChild(left);
                header.appendChild(badge);
                const actions = document.createElement('div');
                actions.className = 'actions';
                const testBtn = document.createElement('button');
                testBtn.className = 'btn btn-primary btn-sm';
                testBtn.textContent = 'Test Now';
                testBtn.addEventListener('click', () => testCheck(c.id));
                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-danger btn-sm';
                delBtn.textContent = 'Delete';
                delBtn.addEventListener('click', () => deleteCheck(c.id));
                actions.appendChild(testBtn);
                actions.appendChild(delBtn);
                card.appendChild(header);
                card.appendChild(actions);
                grid.appendChild(card);
            });
        }

        async function testCheck(id) {
            const resp = await fetch('/api/checks/' + id + '/test', {method: 'POST'});
            const data = await resp.json();
            document.getElementById('resultContent').textContent = JSON.stringify(data.result, null, 2);
            document.getElementById('resultModal').classList.add('active');
        }

        async function deleteCheck(id) {
            if (!confirm('Delete this check?')) return;
            await fetch('/api/checks/' + id, {method: 'DELETE'});
            loadChecks();
        }

        function openCreateModal() { document.getElementById('createModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        async function createCheck() {
            let headers = {};
            try { headers = JSON.parse(document.getElementById('newHeaders').value || '{}'); } catch(e) {}
            const payload = {
                name: document.getElementById('newName').value,
                url: document.getElementById('newUrl').value,
                method: document.getElementById('newMethod').value,
                custom_headers: headers,
                expected_status: parseInt(document.getElementById('newStatus').value),
                content_match: document.getElementById('newContentMatch').value
            };
            const resp = await fetch('/api/checks', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            if (resp.ok) { closeModal('createModal'); loadChecks(); }
            else { const d = await resp.json(); alert(d.error); }
        }

        async function logout() {
            await fetch('/auth/logout', {method:'POST'});
            window.location.href = '/auth/login';
        }

        loadChecks();
    </script>
</body>
</html>
