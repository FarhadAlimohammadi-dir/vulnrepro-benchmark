<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCheck – Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f2f5; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; }
        .card { background: #fff; padding: 2.5rem; border-radius: 8px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 360px; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #2563eb; margin-bottom: 0.5rem; }
        .subtitle { color: #6b7280; font-size: 0.875rem; margin-bottom: 2rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500;
                color: #374151; margin-bottom: 0.375rem; }
        input { width: 100%; padding: 0.625rem 0.75rem; border: 1px solid #d1d5db;
                border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem;
                transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #2563eb;
                      box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { width: 100%; padding: 0.625rem; background: #2563eb; color: #fff;
                 border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600;
                 cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; font-size: 0.8rem; margin-top: 0.75rem; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⚡ PulseCheck</div>
        <div class="subtitle">Uptime monitoring for your infrastructure</div>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <button type="submit">Sign In</button>
            <div class="error" id="errorMsg"></div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                if (resp.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const data = await resp.json();
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error, please try again';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
