<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center;
               align-items: center; min-height: 100vh; background: #f5f6fa; }
        .card { background: #fff; padding: 36px; border-radius: 12px;
                box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 340px; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #dde1e7;
                border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #4f46e5; color: #fff;
                 border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>Register</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <p style="color:red">{{ msg }}</p>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <label>Username</label>
        <input name="username" type="text" required>
        <label>Password</label>
        <input name="password" type="password" required>
        <button type="submit">Create Account</button>
    </form>
</div>
</body>
</html>
