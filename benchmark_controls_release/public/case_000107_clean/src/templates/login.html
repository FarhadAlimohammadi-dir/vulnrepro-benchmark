<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f5f6fa; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
                padding: 40px; width: 360px; }
        h1 { color: #1a1a2e; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444;
                margin-bottom: 6px; margin-top: 18px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #dde1e7;
                border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #4f46e5;
                 color: #fff; border: none; border-radius: 8px; font-size: 15px;
                 font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .alert { background: #fee2e2; color: #dc2626; padding: 10px 14px;
                 border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="card">
    <h1>📝 Notes</h1>
    <p class="subtitle">Sign in to your account</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="alert">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST" action="/login">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
