<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Notes</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               margin: 0; background: #f5f6fa; }
        nav { background: #1a1a2e; color: #fff; padding: 14px 28px;
              display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 18px; margin: 0; }
        nav .actions { display: flex; gap: 12px; align-items: center; }
        nav a, nav button { color: #fff; text-decoration: none; font-size: 13px;
                            background: rgba(255,255,255,.15); border: none;
                            padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
        .note-card { background: #fff; border-radius: 10px; padding: 20px 24px;
                     margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
                     display: flex; justify-content: space-between; align-items: center; }
        .note-title { font-size: 16px; font-weight: 600; color: #1a1a2e; }
        .note-meta { font-size: 12px; color: #888; margin-top: 4px; }
        .note-actions a, .note-actions button { font-size: 12px; color: #4f46e5;
                          background: none; border: none; cursor: pointer;
                          text-decoration: none; margin-left: 12px; }
        .empty { text-align: center; padding: 60px 0; color: #999; }
        .new-btn { display: inline-block; background: #4f46e5; color: #fff;
                   padding: 10px 22px; border-radius: 8px; text-decoration: none;
                   font-size: 14px; font-weight: 600; }
        .search-bar { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 10px 14px; border: 1px solid #dde1e7;
                            border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
<nav>
    <h1>📝 Notes</h1>
    <div class="actions">
        <span style="font-size:13px">Hello, {{ user.username }}</span>
        <a href="/notes/new">+ New Note</a>
        <form method="POST" action="/logout" style="margin:0">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <button type="submit">Sign Out</button>
        </form>
    </div>
</nav>
<div class="container">
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search notes…">
    </div>
    {% if notes %}
        {% for note in notes %}
        <div class="note-card">
            <div>
                <div class="note-title">{{ note['title'] }}</div>
                <div class="note-meta">
                    {{ note['updated_at'][:10] }}
                    {% if note['is_public'] %} &bull; <span style="color:#059669">Public</span>{% endif %}
                </div>
            </div>
            <div class="note-actions">
                <a href="/notes/{{ note['id'] }}">Edit</a>
                <a href="/notes/{{ note['id'] }}/preview" target="_blank">Preview</a>
                <form method="POST" action="/notes/{{ note['id'] }}/delete" style="display:inline">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                    <button type="submit" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="empty">
            <p>No notes yet.</p>
            <a href="/notes/new" class="new-btn">Create your first note</a>
        </div>
    {% endif %}
</div>
<script>
document.getElementById('search-input').addEventListener('input', function() {
    var q = this.value.trim();
    if (q.length < 2) return;
    fetch('/notes/search?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(data => console.log('Search results:', data.results.length));
});
</script>
</body>
</html>
