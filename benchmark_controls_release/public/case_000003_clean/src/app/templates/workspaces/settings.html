{% extends 'layout.html' %}
{% block title %}Settings — {{ ws.name }} &mdash; CodeNest{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Settings: {{ ws.name }}</h1>
  <a href="/workspaces/{{ ws.id }}" class="btn btn-secondary">Back</a>
</div>

{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
{% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}

<form method="post">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ ws.name }}" required minlength="3" maxlength="80">
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3">{{ ws.description or '' }}</textarea>
  </div>
  <div class="form-group">
    <label for="visibility">Visibility</label>
    <select id="visibility" name="visibility">
      {% for v in valid_visibilities %}
      <option value="{{ v }}" {% if ws.visibility == v %}selected{% endif %}>{{ v|title }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label for="language">Primary Language</label>
    <select id="language" name="language">
      {% for l in valid_languages %}
      <option value="{{ l }}" {% if ws.language == l %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Save settings</button>
</form>

<hr class="divider">
<div class="danger-zone">
  <h3>Danger Zone</h3>
  <form method="post" action="/workspaces/{{ ws.id }}/delete"
        onsubmit="return confirm('Delete this workspace? This cannot be undone.')">
    <button type="submit" class="btn btn-danger">Delete workspace</button>
  </form>
</div>
{% endblock %}
