version: '3.9'
services:
  pipelineforge:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - '9000:9000'
    environment:
      PORT: '9000'
      DATABASE: /data/pipelineforge.db
      SECRET_KEY: pf-compose-secret-2024
    volumes:
      - pf_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pf_data:
