<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PromptForge{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="/">⚡ PromptForge</a></div>
  <div class="nav-links">
    {% if session.user_id %}
      <a href="/dashboard">Dashboard</a>
      <a href="/prompts">Library</a>
      {% if session.role == 'admin' %}
        <a href="/admin/">Admin</a>
      {% endif %}
      <a href="/settings/">Settings</a>
      <a href="/profile">{{ session.username }}</a>
      <form action="/logout" method="post" style="display:inline">
        <input type="hidden" name="_csrf" value="{{ g.csrf_token }}">
        <button type="submit" class="btn-secondary">Logout</button>
      </form>
    {% else %}
      <a href="/login" class="btn-primary">Login</a>
    {% endif %}
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
<footer>
  <p>PromptForge v2.1 &mdash; AI Prompt Management Platform</p>
</footer>
</body>
</html>
