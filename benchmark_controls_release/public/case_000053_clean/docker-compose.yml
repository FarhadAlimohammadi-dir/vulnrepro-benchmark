version: '3.8'

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - taskflow_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/taskflow.db
      - SECRET_KEY=supersecretkey-change-in-prod-2025
      - FLASK_ENV=production
    restart: unless-stopped

volumes:
  taskflow_data:
