<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocShare - New Document</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; }
        .nav { background: #0066cc; padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; }
        .nav a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.3rem; color: #555; font-size: 0.9rem; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        textarea { height: 200px; resize: vertical; font-family: monospace; }
        button { padding: 0.75rem 1.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .flash { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; background: #fee; color: #c33; border: 1px solid #fcc; }
    </style>
</head>
<body>
<nav class="nav">
    <strong>DocShare</strong>
    <div><a href="/documents">Documents</a><a href="/logout">Logout</a></div>
</nav>
<div class="container">
    <div class="card">
        <h2>New Document</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea name="content"></textarea>
            </div>
            <div class="form-group">
                <label>Document Type</label>
                <select name="declared_type">
                    <option value="text/plain">Plain Text</option>
                    <option value="text/markdown">Markdown</option>
                    <option value="text/csv">CSV</option>
                    <option value="application/json">JSON</option>
                </select>
            </div>
            <div class="form-group">
                <label>Visibility</label>
                <select name="visibility">
                    <option value="private">Private</option>
                    <option value="public">Public</option>
                </select>
            </div>
            <button type="submit">Create Document</button>
        </form>
    </div>
</div>
</body>
</html>
