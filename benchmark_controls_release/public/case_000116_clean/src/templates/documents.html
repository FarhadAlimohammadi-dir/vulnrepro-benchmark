<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocShare - Documents</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; }
        .nav { background: #0066cc; padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; align-items: center; }
        .nav a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .doc-card { background: white; padding: 1rem 1.5rem; border-radius: 6px; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .doc-title { font-weight: 600; color: #333; }
        .doc-meta { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
        .badge { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 3px; }
        .badge-public { background: #e8f5e9; color: #2e7d32; }
        .badge-private { background: #fce4ec; color: #c62828; }
        .btn { padding: 0.4rem 0.8rem; border-radius: 4px; text-decoration: none; font-size: 0.85rem; margin-left: 0.5rem; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-secondary { background: #eee; color: #333; }
        h2 { color: #333; }
        .actions { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
<nav class="nav">
    <strong>DocShare</strong>
    <div>
        <a href="/documents">Documents</a>
        <a href="/logout">Logout</a>
    </div>
</nav>
<div class="container">
    <h2>Documents</h2>
    <div class="actions">
        <a href="/documents/new" class="btn btn-primary">New Document</a>
    </div>
    {% for doc in documents %}
    <div class="doc-card">
        <div>
            <div class="doc-title">{{ doc.title }}</div>
            <div class="doc-meta">By {{ doc.owner_name }} &bull; {{ doc.created_at }} &bull;
                <span class="badge badge-{{ doc.visibility }}">{{ doc.visibility }}</span>
            </div>
        </div>
        <div>
            <a href="/documents/{{ doc.id }}" class="btn btn-secondary">View</a>
            <a href="/documents/{{ doc.id }}/raw" class="btn btn-secondary">Raw</a>
        </div>
    </div>
    {% else %}
    <p style="color:#888">No documents yet.</p>
    {% endfor %}
</div>
</body>
</html>
