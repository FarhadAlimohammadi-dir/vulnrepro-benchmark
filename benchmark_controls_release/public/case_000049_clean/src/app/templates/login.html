<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Pro — Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); padding: 40px; width: 380px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 24px; color: #1a73e8; }
        .logo p { color: #666; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #333; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #1a73e8; }
        .btn { width: 100%; padding: 11px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .btn:hover { background: #1557b0; }
        .error { background: #fce8e6; color: #c5221f; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
        .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
        .link { color: #1a73e8; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>🎫 HelpDesk Pro</h1>
            <p>Internal IT Support Portal</p>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <hr class="divider">
        <div style="text-align: center;">
            <a href="/admin/access" class="link">IT Staff Portal Access</a>
        </div>

        <div class="footer">
            &copy; 2024 HelpDesk Pro &mdash; v2.4.1
        </div>
    </div>
</body>
</html>
