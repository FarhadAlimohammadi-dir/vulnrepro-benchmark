version: '3.8'

services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/collabify.db
    volumes:
      - collabify_data:/app/data
    restart: unless-stopped

volumes:
  collabify_data:
