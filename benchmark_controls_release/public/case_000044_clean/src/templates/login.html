<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub – Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f2f5; display: flex; align-items: center;
               justify-content: center; height: 100vh; }
        .card { background: #fff; border-radius: 8px; padding: 40px;
                width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 1.6rem; }
        p.sub { color: #6c757d; margin-bottom: 24px; font-size: 0.9rem; }
        label { display: block; margin-bottom: 4px; font-weight: 500;
                color: #333; font-size: 0.9rem; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd;
                border-radius: 4px; font-size: 1rem; margin-bottom: 16px; }
        button { width: 100%; padding: 11px; background: #4f46e5; color: #fff;
                 border: none; border-radius: 4px; font-size: 1rem;
                 cursor: pointer; font-weight: 600; }
        button:hover { background: #4338ca; }
        .err { color: #dc3545; font-size: 0.85rem; margin-top: 12px; }
        a { color: #4f46e5; text-decoration: none; font-size: 0.85rem; }
        .footer { text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
<div class="card">
    <h1>ProjectHub</h1>
    <p class="sub">Sign in to your workspace</p>
    <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="your username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="submit">Sign In</button>
        <div class="err" id="errMsg"></div>
    </form>
    <div class="footer"><a href="/register">Create an account</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
        })
    });
    if (resp.ok) {
        window.location.href = '/dashboard';
    } else {
        const d = await resp.json();
        document.getElementById('errMsg').textContent = d.error || 'Login failed';
    }
});
</script>
</body>
</html>
