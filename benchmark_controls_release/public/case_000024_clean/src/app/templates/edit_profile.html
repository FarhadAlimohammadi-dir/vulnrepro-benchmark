{% extends "layout.html" %}
{% block title %}ModelHub — Edit Profile{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit Profile</h1></div>
<div class="card" style="max-width:560px">
  <form method="post">
    <label>Email</label>
    <input name="email" type="email" value="{{ user.email or '' }}" class="form-control">
    <label style="margin-top:1rem">Bio</label>
    <textarea name="bio" rows="4" class="form-control">{{ user.bio or '' }}</textarea>
    <div style="margin-top:1rem">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="/profile" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
