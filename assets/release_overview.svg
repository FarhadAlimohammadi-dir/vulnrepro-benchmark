<text x="54" y="68" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="38" font-weight="800">VulnRepro Research Benchmark</text>
<text x="56" y="106" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="18">Blind source-code vulnerability detection with paired clean controls</text>
