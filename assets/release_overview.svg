<text x="78" y="244" fill="#dc2626" font-family="Segoe UI, Arial" font-size="42" font-weight="800">119</text>
<text x="78" y="282" fill="#334155" font-family="Segoe UI, Arial" font-size="17" font-weight="600">vulnerable apps</text>
<rect x="332" y="188" width="250" height="132" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
<text x="356" y="244" fill="#16a34a" font-family="Segoe UI, Arial" font-size="42" font-weight="800">119</text>
<text x="356" y="282" fill="#334155" font-family="Segoe UI, Arial" font-size="17" font-weight="600">clean controls</text>
<rect x="610" y="188" width="250" height="132" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
<text x="634" y="244" fill="#2563eb" font-family="Segoe UI, Arial" font-size="42" font-weight="800">238</text>
<text x="634" y="282" fill="#334155" font-family="Segoe UI, Arial" font-size="17" font-weight="600">blind tasks</text>
<rect x="888" y="188" width="250" height="132" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
<text x="912" y="244" fill="#6f5bd8" font-family="Segoe UI, Arial" font-size="42" font-weight="800">63.4%</text>
<text x="912" y="282" fill="#334155" font-family="Segoe UI, Arial" font-size="17" font-weight="600">best balanced: Claude Opus 4.7</text>
<rect x="54" y="365" width="520" height="180" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
<text x="84" y="410" fill="#111827" font-family="Segoe UI, Arial" font-size="24" font-weight="800">What it measures</text>
<text x="84" y="448" fill="#334155" font-family="Segoe UI, Arial" font-size="17">1. Detect real vulnerabilities in source code</text>
<text x="84" y="481" fill="#334155" font-family="Segoe UI, Arial" font-size="17">2. Identify file, location, type, CWE, chain, and fix</text>
<text x="84" y="514" fill="#334155" font-family="Segoe UI, Arial" font-size="17">3. Stay quiet on paired clean controls</text>
<rect x="626" y="365" width="520" height="180" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
<text x="656" y="410" fill="#111827" font-family="Segoe UI, Arial" font-size="24" font-weight="800">What it is not</text>
<text x="656" y="448" fill="#334155" font-family="Segoe UI, Arial" font-size="17">Not a pure exploit-generation benchmark</text>
<text x="656" y="481" fill="#334155" font-family="Segoe UI, Arial" font-size="17">Not a black-box web CTF benchmark</text>
<text x="656" y="514" fill="#334155" font-family="Segoe UI, Arial" font-size="17">Private exploits are validation/scoring assets</text>
<text x="54" y="585" fill="#64748b" font-family="Segoe UI, Arial" font-size="14">Research-grade frozen release: 2026-05-30. Public source packages are model-facing; private assets are for scoring only.</text>
